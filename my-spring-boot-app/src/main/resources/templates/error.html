<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错误</title>
    <style>
        :root {
            --primary: #0f766e;
            --danger: #dc2626;
            --warning: #d97706;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Helvetica Neue", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #fee2e2, #fef2f2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }

        .error-code {
            font-size: 72px;
            font-weight: 700;
            color: var(--danger);
            line-height: 1;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 28px;
            color: #374151;
            margin-bottom: 16px;
        }

        .error-message {
            font-size: 18px;
            color: #6b7280;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .error-timestamp {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
            margin: 0 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.3);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        .error-icon {
            font-size: 80px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">⚠️</div>
        <div class="error-code" th:text="${errorCode} ?: '500'">500</div>
        <h1>出错了</h1>
        <p class="error-message" th:text="${error} ?: '发生了未知错误'">发生了未知错误</p>
        <p class="error-timestamp" th:text="${timestamp} ?: ''"></p>
        <div>
            <a href="/items" class="btn">返回首页</a>
            <a href="javascript:history.back()" class="btn btn-outline">返回上一页</a>
        </div>
    </div>
</body>
</html>
