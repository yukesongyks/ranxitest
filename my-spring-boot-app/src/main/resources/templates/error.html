<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错误</title>
    <style>
        :root {
            --primary: #0f766e;
            --danger: #dc2626;
        }
        
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            font-family: "Helvetica Neue", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #fee2e2, #fef2f2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }
        
        h1 {
            font-size: 48px;
            color: var(--danger);
            margin-bottom: 16px;
        }
        
        p {
            font-size: 18px;
            color: #6b7280;
            margin-bottom: 32px;
        }
        
        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>出错了</h1>
        <p th:text="${error} ?: '发生了未知错误'"></p>
        <a href="/items" class="btn">返回首页</a>
    </div>
</body>
</html>
