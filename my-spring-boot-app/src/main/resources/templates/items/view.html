<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物品详情</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #0f766e;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Helvetica Neue", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #f0fdf4, #eff6ff);
            color: var(--text);
        }

        .container {
            max-width: 680px;
            margin: 40px auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }

        .header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .detail-group {
            margin-bottom: 16px;
        }

        .label {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .value {
            font-size: 16px;
            color: var(--text);
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
        }

        .actions {
            margin-top: 24px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
        }

        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>物品详情</h1>
    </div>

    <div class="detail-group">
        <div class="label">ID</div>
        <div class="value" th:text="${item.id}"></div>
    </div>

    <div class="detail-group">
        <div class="label">名称</div>
        <div class="value" th:text="${item.name}"></div>
    </div>

    <div class="detail-group">
        <div class="label">分类</div>
        <div class="value" th:text="${item.category}"></div>
    </div>

    <div class="detail-group">
        <div class="label">库存数量</div>
        <div class="value" th:text="${item.quantity}"></div>
    </div>

    <div class="detail-group">
        <div class="label">价格</div>
        <div class="price" th:text="${#numbers.formatDecimal(item.price, 1, 2)} + ' 元'"></div>
    </div>

    <div class="actions">
        <a class="btn btn-primary" th:href="@{/items/{id}/edit(id=${item.id})}">编辑物品</a>
        <a class="btn btn-secondary" th:href="@{/items}">返回列表</a>
        <form th:action="@{/items/{id}/delete(id=${item.id})}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-danger">删除物品</button>
        </form>
    </div>
</div>
</body>
</html>
