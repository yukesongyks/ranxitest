<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物品管理系统</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #0f766e;
            --danger: #dc2626;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Helvetica Neue", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #eef7f4, #f7fafc);
            color: var(--text);
        }

        .container {
            max-width: 980px;
            margin: 40px auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 16px;
        }

        h1 {
            margin: 0;
            font-size: 26px;
        }

        .desc {
            margin-top: 6px;
            color: var(--muted);
            font-size: 14px;
        }

        .btn {
            display: inline-block;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }

        .btn-danger {
            background: #fee2e2;
            color: var(--danger);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #f8fafc;
        }

        tr:hover td {
            background: #f9fcff;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .empty {
            margin: 16px 0;
            color: var(--muted);
        }

        .search-section {
            margin-bottom: 20px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .search-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
        }

        .filter-section {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 14px;
            color: var(--muted);
            font-weight: 500;
        }

        .filter-link {
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            color: var(--muted);
            font-size: 14px;
            background: #f1f5f9;
            transition: all 0.2s;
        }

        .filter-link:hover {
            background: #e2e8f0;
        }

        .filter-link.active {
            background: var(--primary);
            color: white;
        }

        .item-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .item-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            .container {
                margin: 16px;
                padding: 16px;
            }

            th:nth-child(3), td:nth-child(3) {
                display: none;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top">
        <div>
            <h1>物品管理系统</h1>
            <div class="desc">支持物品新增、编辑、删除与库存价格管理</div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
            <a class="btn btn-secondary" th:href="@{/profile}">个人中心</a>
            <a class="btn btn-secondary" th:if="${docgenExportEnabled}" th:href="@{/items/export.txt}">导出TXT</a>
            <a class="btn btn-primary" th:href="@{/items/new}">+ 新增物品</a>
        </div>
    </div>

    <div class="search-section">
        <form th:action="@{/items/search}" method="get" class="search-form">
            <input type="text" name="keyword" placeholder="搜索物品名称、分类..." class="search-input" th:value="${keyword}">
            <button type="submit" class="btn btn-primary">搜索</button>
            <a th:href="@{/items}" class="btn btn-secondary">重置</a>
        </form>
    </div>

    <div class="filter-section" th:if="${not #lists.isEmpty(items)}">
        <span class="filter-label">分类筛选:</span>
        <a th:href="@{/items}" class="filter-link" th:class="${category == null ? 'active' : ''}">全部</a>
        <a th:href="@{/items/category/电子设备}" class="filter-link" th:class="${category == '电子设备' ? 'active' : ''}">电子设备</a>
        <a th:href="@{/items/category/办公用品}" class="filter-link" th:class="${category == '办公用品' ? 'active' : ''}">办公用品</a>
        <a th:href="@{/items/category/家具}" class="filter-link" th:class="${category == '家具' ? 'active' : ''}">家具</a>
    </div>

    <p class="empty" th:if="${#lists.isEmpty(items)}">当前没有物品，请先创建一条记录。</p>

    <table th:if="${not #lists.isEmpty(items)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>名称</th>
            <th>分类</th>
            <th>库存</th>
            <th>价格</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.id}"></td>
            <td>
                <a th:href="@{/items/{id}(id=${item.id})}" class="item-link" th:text="${item.name}"></a>
            </td>
            <td th:text="${item.category}"></td>
            <td th:text="${item.quantity}"></td>
            <td th:text="${#numbers.formatDecimal(item.price, 1, 2)}"></td>
            <td>
                <div class="actions">
                    <a class="btn btn-secondary" th:href="@{/items/{id}/edit(id=${item.id})}">编辑</a>
                    <form th:action="@{/items/{id}/delete(id=${item.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger">删除</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
