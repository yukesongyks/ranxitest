<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的物品</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #0f766e;
            --danger: #dc2626;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Helvetica Neue", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #eef7f4, #f7fafc);
            color: var(--text);
        }

        .container {
            max-width: 960px;
            margin: 40px auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .nav a { color: var(--muted); text-decoration: none; }
        .nav a:hover { color: var(--primary); }
        .nav-sep { color: var(--muted); }
        .nav-current { color: var(--text); font-weight: 500; }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 16px;
            flex-wrap: wrap;
        }

        h1 { margin: 0; font-size: 22px; }

        .btn {
            display: inline-block;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #e2e8f0; color: #334155; }
        .btn-danger { background: #fee2e2; color: var(--danger); }

        .search-section {
            margin-bottom: 20px;
            padding: 14px 16px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .search-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 14px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .alert-success { background: #d1fae5; color: #065f46; }
        .alert-error   { background: #fee2e2; color: var(--danger); }

        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 10px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            font-size: 14px;
        }

        th { background: #f8fafc; font-weight: 600; color: var(--muted); }

        tr:last-child td { border-bottom: none; }

        tr:hover td { background: #f9fcff; }

        .actions { display: flex; gap: 8px; align-items: center; }

        .empty { text-align: center; padding: 40px 0; color: var(--muted); }

        .item-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .item-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <div class="nav">
        <a th:href="@{/items}">物品管理</a>
        <span class="nav-sep">/</span>
        <a th:href="@{/profile}">个人中心</a>
        <span class="nav-sep">/</span>
        <span class="nav-current">我的物品</span>
    </div>

    <div class="top">
        <h1>我的物品</h1>
        <a class="btn btn-primary" th:href="@{/profile/items/new}">+ 新增物品</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="search-section">
        <form th:action="@{/profile/items}" method="get" class="search-form">
            <input type="text" name="keyword" placeholder="搜索物品名称、分类..." class="search-input" th:value="${keyword}">
            <button type="submit" class="btn btn-primary">搜索</button>
            <a th:href="@{/profile/items}" class="btn btn-secondary">重置</a>
        </form>
    </div>

    <p class="empty" th:if="${#lists.isEmpty(items)}">暂无物品，快来添加第一件物品吧！</p>

    <table th:if="${not #lists.isEmpty(items)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>名称</th>
            <th>分类</th>
            <th>库存</th>
            <th>价格</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.id}"></td>
            <td>
                <a th:href="@{/items/{id}(id=${item.id})}" class="item-link" th:text="${item.name}"></a>
            </td>
            <td th:text="${item.category}"></td>
            <td th:text="${item.quantity}"></td>
            <td th:text="${#numbers.formatDecimal(item.price, 1, 2)}"></td>
            <td>
                <div class="actions">
                    <a class="btn btn-secondary" th:href="@{/profile/items/{id}/edit(id=${item.id})}">编辑</a>
                    <form th:action="@{/profile/items/{id}/delete(id=${item.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger">删除</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
