<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑个人信息</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #0f766e;
            --border: #e5e7eb;
            --danger: #dc2626;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Helvetica Neue", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #f0fdf4, #eff6ff);
            color: var(--text);
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .nav a { color: var(--muted); text-decoration: none; }
        .nav a:hover { color: var(--primary); }
        .nav-sep { color: var(--muted); }
        .nav-current { color: var(--text); font-weight: 500; }

        h1 {
            margin: 0 0 24px;
            font-size: 22px;
            color: var(--primary);
        }

        .form-row {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--muted);
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea { resize: vertical; min-height: 80px; }

        .field-error {
            color: var(--danger);
            font-size: 12px;
            margin-top: 4px;
        }

        .actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary { background: #e2e8f0; color: #334155; }
    </style>
</head>
<body>
<div class="container">
    <div class="nav">
        <a th:href="@{/items}">物品管理</a>
        <span class="nav-sep">/</span>
        <a th:href="@{/profile}">个人中心</a>
        <span class="nav-sep">/</span>
        <span class="nav-current">编辑个人信息</span>
    </div>

    <h1>编辑个人信息</h1>

    <form th:object="${user}" th:action="@{/profile/edit}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-row">
            <label for="username">用户名</label>
            <input id="username" type="text" th:field="*{username}" placeholder="请输入用户名">
            <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>

        <div class="form-row">
            <label for="email">邮箱</label>
            <input id="email" type="email" th:field="*{email}" placeholder="请输入邮箱地址">
            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-row">
            <label for="phone">手机号</label>
            <input id="phone" type="text" th:field="*{phone}" placeholder="请输入手机号（选填）">
            <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>

        <div class="form-row">
            <label for="bio">个人简介</label>
            <textarea id="bio" th:field="*{bio}" placeholder="介绍一下自己吧（选填）"></textarea>
            <div class="field-error" th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}"></div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" type="submit">保存</button>
            <a class="btn btn-secondary" th:href="@{/profile}">取消</a>
        </div>
    </form>
</div>
</body>
</html>
