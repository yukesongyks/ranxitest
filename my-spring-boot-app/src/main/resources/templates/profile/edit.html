<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑个人信息</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #0f766e;
            --border: #e5e7eb;
            --danger: #dc2626;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Helvetica Neue", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #eef7f4, #f7fafc);
            color: var(--text);
            min-height: 100vh;
        }

        .nav {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 14px 32px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-brand {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-link {
            font-size: 14px;
            color: var(--muted);
            text-decoration: none;
        }

        .nav-link:hover {
            color: var(--primary);
        }

        .container {
            max-width: 680px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 24px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0 0 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
        }

        label .required {
            color: var(--danger);
            margin-left: 2px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="url"],
        textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            color: var(--text);
            font-family: inherit;
            transition: border-color 0.2s;
            background: #fafafa;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .field-error {
            font-size: 12px;
            color: var(--danger);
        }

        .avatar-preview-section {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .avatar-preview {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: white;
            font-weight: 700;
            flex-shrink: 0;
            overflow: hidden;
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-hint {
            font-size: 13px;
            color: var(--muted);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .btn {
            display: inline-block;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #0d9488;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<nav class="nav">
    <a href="/" class="nav-brand">📦 物品管理系统</a>
    <a href="/items" class="nav-link">物品列表</a>
    <a href="/profile" class="nav-link" style="color: var(--primary); font-weight: 500;">个人中心</a>
</nav>

<div class="container">
    <div class="page-title">✏️ 编辑个人信息</div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="card">
        <form th:object="${user}" th:action="@{/profile/edit}" method="post">
            <input type="hidden" th:field="*{id}">

            <!-- 头像预览 -->
            <div class="avatar-preview-section">
                <div class="avatar-preview" id="avatarPreview">
                    <img th:if="${user.avatarUrl != null and !user.avatarUrl.isEmpty()}"
                         th:src="${user.avatarUrl}" id="avatarImg" alt="头像">
                    <span th:if="${user.avatarUrl == null or user.avatarUrl.isEmpty()}" id="avatarInitial"
                          th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}"></span>
                </div>
                <div class="avatar-hint">
                    <div style="font-weight: 500; margin-bottom: 4px;">头像</div>
                    <div>填写头像图片 URL 后自动预览</div>
                </div>
            </div>

            <!-- 基本信息 -->
            <div class="section-title">基本信息</div>
            <div class="form-grid">
                <div class="form-row">
                    <label for="username">用户名 <span class="required">*</span></label>
                    <input id="username" type="text" th:field="*{username}" placeholder="请输入用户名">
                    <span class="field-error" th:if="${#fields.hasErrors('username')}"
                          th:errors="*{username}"></span>
                </div>

                <div class="form-row">
                    <label for="email">邮箱 <span class="required">*</span></label>
                    <input id="email" type="email" th:field="*{email}" placeholder="请输入邮箱">
                    <span class="field-error" th:if="${#fields.hasErrors('email')}"
                          th:errors="*{email}"></span>
                </div>

                <div class="form-row">
                    <label for="phone">手机号</label>
                    <input id="phone" type="tel" th:field="*{phone}" placeholder="请输入手机号">
                    <span class="field-error" th:if="${#fields.hasErrors('phone')}"
                          th:errors="*{phone}"></span>
                </div>

                <div class="form-row">
                    <label for="location">所在地</label>
                    <input id="location" type="text" th:field="*{location}" placeholder="例如：北京市">
                    <span class="field-error" th:if="${#fields.hasErrors('location')}"
                          th:errors="*{location}"></span>
                </div>

                <div class="form-row full-width">
                    <label for="avatarUrl">头像 URL</label>
                    <input id="avatarUrl" type="url" th:field="*{avatarUrl}"
                           placeholder="请输入头像图片链接（可选）"
                           oninput="previewAvatar(this.value)">
                </div>

                <div class="form-row full-width">
                    <label for="bio">个人简介</label>
                    <textarea id="bio" th:field="*{bio}" placeholder="介绍一下自己吧..."></textarea>
                    <span class="field-error" th:if="${#fields.hasErrors('bio')}"
                          th:errors="*{bio}"></span>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">保存修改</button>
                <a href="/profile" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
</div>

<script>
    function previewAvatar(url) {
        const preview = document.getElementById('avatarPreview');
        const initial = document.getElementById('avatarInitial');
        let img = document.getElementById('avatarImg');

        if (url && url.trim() !== '') {
            if (!img) {
                img = document.createElement('img');
                img.id = 'avatarImg';
                img.alt = '头像';
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';
                preview.appendChild(img);
            }
            img.src = url;
            img.style.display = 'block';
            if (initial) initial.style.display = 'none';
        } else {
            if (img) img.style.display = 'none';
            if (initial) initial.style.display = 'block';
        }
    }
</script>

</body>
</html>
