<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物品管理系统</title>
    <style>
        :root {
            --primary: #0f766e;
            --bg: linear-gradient(135deg, #f0fdf4, #eff6ff);
        }
        
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            font-family: "Helvetica Neue", "PingFang SC", sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            padding: 40px;
        }
        
        h1 {
            font-size: 36px;
            color: var(--primary);
            margin-bottom: 16px;
        }
        
        p {
            font-size: 18px;
            color: #6b7280;
            margin-bottom: 32px;
        }
        
        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>物品管理系统</h1>
        <p>简单高效的物品库存管理解决方案</p>
        <a href="/items" class="btn">进入系统</a>
    </div>
</body>
</html>
