<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摇号系统</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #0f766e;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Helvetica Neue", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #eef7f4, #f7fafc);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 520px;
            margin: 40px auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            color: var(--primary);
        }

        .desc {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .result {
            font-size: 96px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
            margin: 24px 0;
            min-height: 96px;
        }

        .result.pending {
            color: var(--muted);
            font-size: 18px;
            font-weight: 400;
        }

        .btn {
            display: inline-block;
            border: none;
            border-radius: 8px;
            padding: 14px 36px;
            background: var(--primary);
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back {
            display: inline-block;
            margin-top: 24px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>摇号系统</h1>
    <div class="desc">点击下方按钮，随机抽取 1-99 之间的数字</div>

    <div id="result" class="result pending">等待摇号</div>

    <button id="drawBtn" class="btn" type="button">摇号</button>
    <br>
    <a class="back" th:href="@{/items}">返回物品管理</a>
</div>

<script>
    (function () {
        var btn = document.getElementById('drawBtn');
        var result = document.getElementById('result');

        btn.addEventListener('click', function () {
            btn.disabled = true;
            result.textContent = '摇号中...';
            result.className = 'result pending';

            fetch('/lottery/draw')
                .then(function (res) {
                    if (!res.ok) {
                        throw new Error('摇号失败');
                    }
                    return res.json();
                })
                .then(function (data) {
                    result.textContent = data.number;
                    result.className = 'result';
                })
                .catch(function (err) {
                    result.textContent = '出错了：' + err.message;
                    result.className = 'result pending';
                })
                .finally(function () {
                    btn.disabled = false;
                });
        });
    })();
</script>
</body>
</html>
