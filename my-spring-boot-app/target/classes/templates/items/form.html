<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${item.id == null ? '新增物品' : '编辑物品'}"></title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #0f766e;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Helvetica Neue", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #f0fdf4, #eff6ff);
            color: var(--text);
        }

        .container {
            max-width: 680px;
            margin: 40px auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 18px;
        }

        .form-row {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--muted);
        }

        input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
        }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${item.id == null ? '新增物品' : '编辑物品'}"></h1>

    <form th:object="${item}" th:action="${item.id == null ? '/items' : '/items/' + item.id}" method="post">
        <div class="form-row">
            <label for="name">名称</label>
            <input id="name" type="text" th:field="*{name}" placeholder="请输入物品名称" required>
        </div>

        <div class="form-row">
            <label for="category">分类</label>
            <input id="category" type="text" th:field="*{category}" placeholder="例如：电子设备、办公用品" required>
        </div>

        <div class="form-row">
            <label for="quantity">库存</label>
            <input id="quantity" type="number" min="0" th:field="*{quantity}" required>
        </div>

        <div class="form-row">
            <label for="price">价格</label>
            <input id="price" type="number" min="0" step="0.01" th:field="*{price}" required>
        </div>

        <div class="actions">
            <button class="btn btn-primary" type="submit">保存</button>
            <a class="btn btn-secondary" th:href="@{/items}">返回列表</a>
        </div>
    </form>
</div>
</body>
</html>
